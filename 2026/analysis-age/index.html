<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>美柚年龄填写引导 Demo V1.33 · 压缩单文件版</title>
  <style>
    :root {
      --my-brand-red: #ff4d88;
      --my-brand-soft: rgba(255, 77, 136, 0.08);
      --my-bg: #f2f2f5;
      --my-surface: #ffffff;
      --my-text-primary: #323232;
      --my-text-secondary: #666666;
      --my-text-tertiary: #999999;
      --my-line: rgba(0, 0, 0, 0.08);
      --my-shadow-2: 0 8px 24px rgba(0, 0, 0, 0.14);
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; min-height: 100%; }

    body {
      display: grid;
      place-items: start center;
      padding: 16px;
      overflow: hidden;
      background: #e9e9ed;
      color: var(--my-text-primary);
      font-family: "PingFang SC", "SF Pro Text", "Microsoft YaHei UI", sans-serif;
      letter-spacing: 0;
    }

    button { font: inherit; }

    .demo-shell {
      width: min(100%, 430px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .scenario-switch {
      width: 100%;
      min-height: 44px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      padding: 4px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 2px 10px rgba(50, 50, 50, 0.08);
    }

    .scenario-switch button {
      min-height: 36px;
      padding: 0 8px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--my-text-secondary);
      font-size: 13px;
      font-weight: 400;
      cursor: pointer;
      white-space: nowrap;
    }

    .scenario-switch button[aria-pressed="true"] {
      background: var(--my-brand-red);
      color: #fff;
      font-weight: 500;
    }

    .phone {
      position: relative;
      width: min(390px, calc(100vw - 16px), calc((100vh - 84px) * 0.462085));
      height: auto;
      aspect-ratio: 390 / 844;
      overflow: hidden;
      background: var(--my-bg);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.14);
      container-type: inline-size;
    }

    .screen {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      user-select: none;
      -webkit-user-drag: none;
    }

    .analysis-layer { display: none; position: absolute; inset: 0; background: #fff2f7; }
    .phone[data-view="analysis"] .analysis-layer { display: block; }
    .phone[data-view="analysis"] > .screen { display: none; }

    .analysis-layer .analysis-top,
    .analysis-layer .analysis-bottom {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      user-select: none;
      -webkit-user-drag: none;
    }

    .analysis-layer .analysis-top { clip-path: inset(0 0 calc(100% - 26cqw) 0); }
    .analysis-layer .analysis-bottom {
      transform: translateY(23cqw);
      clip-path: inset(26cqw 0 0 0);
    }

    .analysis-task {
      position: absolute;
      z-index: 3;
      left: 3.1%;
      top: 29cqw;
      width: 93.8%;
      height: 17cqw;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 2.56cqw;
      padding: 0 3.08cqw 0 4.1cqw;
      border: 0.26cqw solid rgba(255, 77, 136, 0.16);
      border-radius: 3.08cqw;
      background: #fffafd;
      color: var(--my-text-primary);
      text-align: left;
      cursor: pointer;
    }

    .analysis-task::before {
      content: "";
      position: absolute;
      left: 1.54cqw;
      top: 2.56cqw;
      bottom: 2.56cqw;
      width: 0.77cqw;
      border-radius: 999px;
      background: var(--my-brand-red);
    }

    .task-icon {
      width: 7.18cqw;
      height: 7.18cqw;
      display: grid;
      place-items: center;
      border: 0.26cqw solid rgba(255, 77, 136, 0.16);
      border-radius: 2.05cqw;
      background: #fff;
      color: var(--my-brand-red);
    }

    .task-icon svg { width: 5.13cqw; height: 5.13cqw; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    .task-copy { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
    .task-copy strong { font-size: 4.1cqw; line-height: 5.38cqw; font-weight: 400; white-space: nowrap; }
    .task-copy small { overflow: hidden; color: var(--my-text-secondary); font-size: 3.33cqw; line-height: 4.36cqw; font-weight: 400; text-overflow: ellipsis; white-space: nowrap; }
    .task-action {
      min-width: 20.5cqw;
      min-height: 8.21cqw;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 2.56cqw;
      border: 0.26cqw solid var(--my-brand-red);
      border-radius: 999px;
      background: #fff;
      color: var(--my-brand-red);
      font-size: 3.33cqw;
      line-height: 4.36cqw;
      font-weight: 500;
      white-space: nowrap;
    }

    .new-user-fill,
    .new-user-skip {
      display: none;
      position: absolute;
      z-index: 5;
      top: 60.9%;
      height: 5.2%;
      border: 0;
      background: transparent;
      color: transparent;
      cursor: pointer;
    }

    .phone[data-view="new"] .new-user-fill,
    .phone[data-view="new"] .new-user-skip { display: block; }
    .new-user-mode-switch {
      display: none;
      position: absolute;
      z-index: 6;
      left: 13%;
      top: 5.85%;
      width: 74%;
      height: 6.15%;
      grid-template-columns: repeat(4, 1fr);
      align-items: stretch;
      gap: 0.77cqw;
      padding: 0.77cqw;
      border: 0.26cqw solid rgba(255, 255, 255, 0.9);
      border-radius: 2.56cqw;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 1.54cqw 4.1cqw rgba(0, 0, 0, 0.16);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      font-family: "PingFang SC", "PingFang TC", "Microsoft YaHei UI", sans-serif;
    }
    .phone[data-view="new"] .new-user-mode-switch { display: grid; }
    .new-user-mode-switch button {
      position: relative;
      padding: 0;
      border: 0;
      background: transparent;
      border-radius: 1.79cqw;
      color: #555;
      font-size: 3.59cqw;
      line-height: 5.13cqw;
      font-weight: 500;
      cursor: pointer;
    }
    .new-user-mode-switch button[aria-pressed="true"] {
      background: var(--my-brand-red);
      color: #fff;
      font-weight: 500;
    }
    .new-user-copy {
      display: none;
      position: absolute;
      z-index: 4;
      left: 19.5%;
      top: 54.4%;
      width: 64%;
      min-height: 5.8%;
      align-items: center;
      background: #fff;
      color: var(--my-text-primary);
      font-family: "PingFang SC", "PingFang TC", "Microsoft YaHei UI", sans-serif;
      font-size: 4.1cqw;
      line-height: 5.64cqw;
      font-weight: 400;
      text-align: left;
    }
    .phone[data-view="new"] .new-user-copy { display: flex; }
    .new-user-title,
    .new-user-action {
      display: none;
      position: absolute;
      z-index: 4;
      align-items: center;
      justify-content: center;
      font-family: "PingFang SC", "PingFang TC", "Microsoft YaHei UI", sans-serif;
      font-weight: 500;
      text-align: center;
    }
    .new-user-title {
      left: 28%;
      top: 50.35%;
      width: 44%;
      height: 4.8%;
      background: #fff;
      color: var(--my-text-primary);
      font-size: 4.87cqw;
      line-height: 6.15cqw;
      font-weight: 600;
    }
    .new-user-action {
      left: 51.4%;
      top: 61.35%;
      width: 31.8%;
      height: 5.2%;
      border-radius: 999px;
      background: var(--my-brand-red);
      color: #fff;
      font-size: 4.1cqw;
      line-height: 5.64cqw;
    }
    .phone[data-view="new"] .new-user-title,
    .phone[data-view="new"] .new-user-action { display: flex; }
    .new-user-skip { left: 20.4%; width: 28.5%; }
    .new-user-fill { left: 51.4%; width: 31.8%; }

    .period-toggle-hotspot {
      display: none;
      position: absolute;
      z-index: 7;
      left: 70%;
      width: 30%;
      height: 15cqw;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .phone[data-view="record"] .period-toggle-hotspot {
      display: block;
      top: 60.6%;
      left: 68%;
      width: 29%;
      height: 7.5%;
    }
    .phone[data-view="home"] .period-toggle-hotspot { display: block; top: 29.5%; }

    .record-detail-layer {
      position: absolute;
      z-index: 16;
      inset: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .record-detail-layer.is-open { visibility: visible; pointer-events: auto; }
    .record-detail-image {
      position: absolute;
      z-index: 1;
      top: 0;
      left: 0;
      width: 100%;
      height: auto;
      clip-path: inset(36.3cqw 0 0 0);
      user-select: none;
      -webkit-user-drag: none;
    }

    .record-detail-action {
      position: absolute;
      z-index: 3;
      top: 16.7%;
      width: 25%;
      height: 7.5%;
      border: 0;
      background: transparent;
      color: transparent;
      cursor: pointer;
    }

    .record-detail-cancel { left: 0; }
    .record-detail-confirm { right: 0; }

    .guide-layer,
    .picker-layer {
      position: absolute;
      z-index: 20;
      inset: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .guide-layer.is-open,
    .picker-layer.is-open { visibility: visible; pointer-events: auto; }

    .scrim {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: rgba(0, 0, 0, 0.36);
      opacity: 0;
      transition: opacity 180ms ease;
    }

    .is-open .scrim { opacity: 1; }

    .guide-sheet,
    .picker-sheet {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      overflow: hidden;
      border-radius: 3.08cqw 3.08cqw 0 0;
      background: var(--my-surface);
      color: var(--my-text-primary);
      box-shadow: var(--my-shadow-2);
      transform: translateY(102%);
      transition: transform 220ms cubic-bezier(.22, .72, .32, 1);
    }

    .is-open .guide-sheet,
    .is-open .picker-sheet { transform: translateY(0); }

    .guide-sheet {
      height: 46.9%;
      min-height: 0;
      padding: 0 3.08cqw;
      font-family: "PingFang SC", "PingFang TC", "SF Pro Text", "Microsoft YaHei UI", sans-serif;
    }
    .sheet-handle { display: none; }
    .guide-illustration {
      width: calc(100% + 6.16cqw);
      height: 46cqw;
      margin: 0 -3.08cqw;
      overflow: hidden;
      border-radius: 3.08cqw 3.08cqw 0 0;
      background: #bcd4ff;
    }
    .guide-illustration img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center; }
    .guide-close {
      position: absolute;
      z-index: 2;
      top: 2.05cqw;
      right: 2.05cqw;
      width: 11.28cqw;
      height: 11.28cqw;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: #c2c2c7;
      font-family: "PingFang SC", "PingFang TC", sans-serif;
      font-size: 8.2cqw;
      line-height: 10.26cqw;
      font-weight: 300;
      cursor: pointer;
    }
    .guide-sheet h2 { margin: 5.64cqw 0 0; text-align: center; font-size: 4.87cqw; line-height: 6.15cqw; font-weight: 600; }
    .guide-sheet p { margin: 2.05cqw auto 0; max-width: 90cqw; color: var(--my-text-secondary); text-align: center; font-size: 4.36cqw; line-height: 6.15cqw; font-weight: 400; }
    .guide-actions { position: absolute; left: 3.08cqw; right: 3.08cqw; bottom: 11cqw; display: grid; grid-template-columns: 1fr; }
    .guide-actions button { min-height: 12.3cqw; border-radius: 999px; font-size: 4.62cqw; font-weight: 500; cursor: pointer; }
    .guide-confirm { border: 0.26cqw solid var(--my-brand-red); background: var(--my-brand-red); color: #fff; }
    .guide-home-indicator { position: absolute; left: 50%; bottom: 2.05cqw; width: 36%; height: 1.28cqw; transform: translateX(-50%); border-radius: 999px; background: #050505; }

    .guide-actions button,
    .picker-sheet,
    .picker-sheet button { font-family: "PingFang SC", "PingFang TC", "Microsoft YaHei UI", sans-serif; }
    .picker-sheet { min-height: 40.5%; display: flex; flex-direction: column; background: #f7f7f9; }
    .picker-header { min-height: 14.87cqw; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 4.62cqw; }
    .picker-header h2 { margin: 0; font-size: 5.13cqw; line-height: 6.67cqw; font-weight: 500; }
    .picker-header button { min-height: 11.28cqw; padding: 0; border: 0; background: transparent; font-size: 4.36cqw; line-height: 6.15cqw; cursor: pointer; }
    .picker-cancel { justify-self: start; color: var(--my-text-primary); }
    .picker-confirm { justify-self: end; color: var(--my-brand-red); }
    .wheel {
      position: relative;
      flex: 1;
      display: grid;
      grid-template-columns: 1.25fr 1fr 1fr;
      align-items: stretch;
      margin: 0 3.08cqw 4.1cqw;
      padding: 3.08cqw 2.56cqw;
      overflow: hidden;
      border-radius: 3.08cqw;
      background: #fff;
    }

    .wheel-band { position: absolute; z-index: 0; left: 3.08cqw; right: 3.08cqw; top: 50%; height: 20%; border-radius: 2.05cqw; background: #f1f1f4; transform: translateY(-50%); }
    .wheel-column { position: relative; z-index: 1; display: grid; grid-template-rows: repeat(5, 1fr); min-width: 0; }
    .wheel-column button { display: flex; align-items: center; justify-content: center; min-width: 0; padding: 0; border: 0; background: transparent; color: var(--my-text-tertiary); font-size: 4.36cqw; font-weight: 400; white-space: nowrap; cursor: pointer; }
    .wheel-column button.is-selected { color: var(--my-text-primary); font-size: 6.15cqw; font-weight: 500; }
    .home-indicator { width: 36%; height: 1.28cqw; margin: 0 auto 2.05cqw; border-radius: 999px; background: #050505; }

    .toast {
      position: absolute;
      z-index: 40;
      left: 50%;
      top: 45%;
      padding: 2.56cqw 4.1cqw;
      border-radius: 2.05cqw;
      background: rgba(24, 24, 24, 0.82);
      color: #fff;
      font-size: 4.1cqw;
      font-weight: 400;
      white-space: nowrap;
      opacity: 0;
      transform: translate(-50%, 8px);
      transition: opacity 160ms ease, transform 160ms ease;
      pointer-events: none;
    }

    .toast.is-visible { opacity: 1; transform: translate(-50%, 0); }
    .phone.is-complete .analysis-task { display: none; }
    .phone.is-complete .analysis-layer .analysis-top { display: none; }
    .phone.is-complete .analysis-layer .analysis-bottom { transform: none; clip-path: none; }

    @media (max-width: 430px) {
      body { padding: 8px; }
      .demo-shell { gap: 8px; }
      .phone { width: min(390px, calc(100vw - 16px), calc((100vh - 76px) * 0.462085)); height: auto; }
      .scenario-switch { min-height: 52px; }
      .scenario-switch button { min-height: 44px; padding: 0 4px; font-size: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .scrim, .guide-sheet, .picker-sheet, .toast { transition: none; }
    }
  </style>
</head>

      <button type="button" data-view="new" aria-pressed="true">新用户</button>

      <button type="button" data-view="home" aria-pressed="false">首页</button>
      <button type="button" data-view="analysis" aria-pressed="false">分析 · C</button>
    </nav>

      };
      let currentView = 'new';
      const newUserCopy = {
        period: '填写年龄后，我们将结合年龄优化经期预测和分析。',
        trying: '填写年龄后，我们将结合年龄优化经期和排卵预测。',
        pregnancy: '填写年龄后，我们将结合年龄优化孕期管理内容与服务推荐。',
        parenting: '填写年龄后，我们将结合年龄优化女性健康内容与服务推荐。'
      };
      const modeButtons = [...phone.querySelectorAll('.new-user-mode-switch button')];
      const newUserCopyElement = phone.querySelector('.new-user-copy');
      let returnToGuide = false;
      let toastTimer;

      const setLayer = (layer, open) => {
        layer.classList.toggle('is-open', open);
        layer.setAttribute('aria-hidden', String(!open));
      };

      const closeAll = () => {
        setLayer(recordDetailLayer, false);
        setLayer(guideLayer, false);
        setLayer(pickerLayer, false);
      };

      const switchView = (view) => {
        currentView = view;
        closeAll();
        phone.classList.remove('is-complete', 'is-period-start');
        phone.dataset.view = view;
        screen.src = assets[view][0];
        screen.alt = assets[view][1];
        switches.forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.view === view)));
      };

      const switchNewUserMode = (mode) => {
        newUserCopyElement.textContent = newUserCopy[mode];
        modeButtons.forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.mode === mode)));
      };

      const startPeriodRecord = () => {
        if (currentView !== 'record' && currentView !== 'home') return;
        if (phone.classList.contains('is-period-start')) {
          phone.classList.remove('is-period-start');
          screen.src = assets[currentView][0];
          return;
        }
        phone.classList.add('is-period-start');
        screen.src = assets[currentView][2];
        setLayer(recordDetailLayer, true);
      };

      const finishPeriodRecord = () => {
        setLayer(recordDetailLayer, false);
        window.setTimeout(() => setLayer(guideLayer, true), 180);
      };

      const openPicker = (fromGuide) => {
        returnToGuide = fromGuide;
        setLayer(guideLayer, false);
        setLayer(pickerLayer, true);
      };

      const closePicker = () => {
        setLayer(pickerLayer, false);
        if (returnToGuide) setLayer(guideLayer, true);
      };

      const complete = () => {
        closeAll();
        if (currentView === 'new') {
          phone.dataset.view = 'record';
          currentView = 'record';
          screen.src = assets.record[0];
          screen.alt = assets.record[1];
          switches.forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.view === 'record')));
        }
        phone.classList.add('is-complete');
        toast.classList.add('is-visible');
        window.clearTimeout(toastTimer);
        toastTimer = window.setTimeout(() => toast.classList.remove('is-visible'), 1800);
      };

      switches.forEach((button) => button.addEventListener('click', () => switchView(button.dataset.view)));
      modeButtons.forEach((button) => button.addEventListener('click', () => switchNewUserMode(button.dataset.mode)));
      phone.querySelector('.new-user-fill').addEventListener('click', () => openPicker(false));
      phone.querySelector('.new-user-skip').addEventListener('click', () => switchView('record'));
      phone.querySelector('.period-toggle-hotspot').addEventListener('click', startPeriodRecord);
      phone.querySelector('.record-detail-cancel').addEventListener('click', finishPeriodRecord);
      phone.querySelector('.record-detail-confirm').addEventListener('click', finishPeriodRecord);
      phone.querySelector('.analysis-task').addEventListener('click', () => openPicker(false));
      phone.querySelector('.guide-confirm').addEventListener('click', () => openPicker(true));
      phone.querySelector('.guide-close').addEventListener('click', () => setLayer(guideLayer, false));
      phone.querySelector('.guide-scrim').addEventListener('click', () => setLayer(guideLayer, false));
      phone.querySelector('.picker-cancel').addEventListener('click', closePicker);
      phone.querySelector('.picker-scrim').addEventListener('click', closePicker);
      phone.querySelector('.picker-confirm').addEventListener('click', complete);

      phone.querySelectorAll('.wheel-column button').forEach((button) => {
        button.addEventListener('click', () => {
          button.parentElement.querySelectorAll('button').forEach((item) => item.classList.remove('is-selected'));
          button.classList.add('is-selected');
        });
      });
    })();
  </script>
</body>
