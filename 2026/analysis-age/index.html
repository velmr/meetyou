  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  &lt;style&gt;
    #age-prediction-demo {
      --miyou-pink: #ff4384;
      --miyou-text: #252525;
      --miyou-muted: #a5a5a8;
      --miyou-sheet: #f6f6f8;
      --miyou-white: #ffffff;
      --miyou-selection: #f0f0f4;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 4px 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;
    }

    #age-prediction-demo .miyou-phone {
      position: relative;
      width: min(100%, 390px, calc(46.2085dvh - 8px));
      aspect-ratio: 1170 / 2532;
      overflow: hidden;
      border-radius: 0;
      background: #f4f3f6;
      box-shadow: none;
      isolation: isolate;
      container-type: inline-size;
    }

    #age-prediction-demo .miyou-screen {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      user-select: none;
      pointer-events: none;
    }

    #age-prediction-demo .miyou-age-entry {
      position: absolute;
      z-index: 2;
      left: 3.1%;
      top: 61.66%;
      width: 93.8%;
      height: 4.85%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 3.08cqw;
      padding: 0 3.3%;
      border: 0;
      border-radius: 0 0 3.33cqw 3.33cqw;
      background: var(--miyou-white);
      color: var(--miyou-text);
      font: inherit;
      font-size: 3.85cqw;
      font-weight: 400;
      text-align: left;
      cursor: pointer;
      opacity: 1;
      transition: opacity 150ms ease;
    }

    #age-prediction-demo .miyou-age-entry.is-refreshing {
      opacity: 0;
    }

    #age-prediction-demo .miyou-toast {
      position: absolute;
      z-index: 30;
      left: 50%;
      top: 45%;
      padding: 2.56cqw 4.1cqw;
      border-radius: 2.05cqw;
      background: rgba(24, 24, 24, 0.82);
      color: #ffffff;
      font-size: 4.1cqw;
      font-weight: 400;
      white-space: nowrap;
      opacity: 0;
      transform: translate(-50%, 2.05cqw);
      transition: opacity 160ms ease, transform 160ms ease;
      pointer-events: none;
    }

    #age-prediction-demo .miyou-toast.is-visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    #age-prediction-demo .miyou-age-entry:focus-visible,
    #age-prediction-demo .miyou-text-action:focus-visible,
    #age-prediction-demo .miyou-wheel-column button:focus-visible {
      outline: 0.77cqw solid rgba(255, 67, 132, 0.5);
      outline-offset: -0.77cqw;
    }

    #age-prediction-demo .miyou-entry-action {
      flex: 0 0 auto;
      min-width: 20.5cqw;
      min-height: 7.18cqw;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 2.56cqw;
      border: 0.38cqw solid var(--miyou-pink);
      border-radius: 3.59cqw;
      background: transparent;
      color: var(--miyou-pink);
      font-size: 3.33cqw;
      font-weight: 500;
      box-sizing: border-box;
    }

    #age-prediction-demo .miyou-entry-action.is-chevron {
      min-width: 0;
      min-height: 0;
      width: 2.56cqw;
      height: 2.56cqw;
      padding: 0;
      border: 0;
      border-radius: 0;
      border-top: 0.51cqw solid #bebec1;
      border-right: 0.51cqw solid #bebec1;
      background: transparent;
      color: transparent;
      transform: rotate(45deg);
      margin-right: 0.51cqw;
    }

    #age-prediction-demo .miyou-modal-layer {
      position: absolute;
      z-index: 10;
      inset: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #age-prediction-demo .miyou-modal-layer.is-open {
      visibility: visible;
      pointer-events: auto;
    }

    #age-prediction-demo .miyou-scrim {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: rgba(0, 0, 0, 0.36);
      opacity: 0;
      transition: opacity 180ms ease;
      cursor: default;
    }

    #age-prediction-demo .miyou-modal-layer.is-open .miyou-scrim {
      opacity: 1;
    }

    #age-prediction-demo .miyou-birthday-sheet {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      min-height: 40.5%;
      display: flex;
      flex-direction: column;
      border-radius: 5.64cqw 5.64cqw 0 0;
      background: var(--miyou-sheet);
      color: var(--miyou-text);
      transform: translateY(102%);
      transition: transform 220ms cubic-bezier(.22,.72,.32,1);
      overflow: hidden;
    }

    #age-prediction-demo .miyou-modal-layer.is-open .miyou-birthday-sheet {
      transform: translateY(0);
    }

    #age-prediction-demo .miyou-sheet-header {
      min-height: 14.87cqw;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 4.62cqw;
    }

    #age-prediction-demo .miyou-sheet-header h2 {
      margin: 0;
      font-size: 5.13cqw;
      font-weight: 500;
    }

    #age-prediction-demo .miyou-text-action {
      min-height: 11.28cqw;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--miyou-text);
      font: inherit;
      font-size: 4.62cqw;
      cursor: pointer;
    }

    #age-prediction-demo .miyou-cancel {
      justify-self: start;
    }

    #age-prediction-demo .miyou-confirm {
      justify-self: end;
      color: var(--miyou-pink);
    }

    #age-prediction-demo .miyou-wheel {
      position: relative;
      flex: 1;
      display: grid;
      grid-template-columns: 1.25fr 1fr 1fr;
      align-items: stretch;
      margin: 0 3.08cqw 4.1cqw;
      padding: 4.1cqw 2.56cqw;
      border-radius: 4.36cqw;
      background: var(--miyou-white);
      overflow: hidden;
    }

  &lt;/style&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;age-prediction-demo&#x27;);
      const entry = root.querySelector(&#x27;.miyou-age-entry&#x27;);
      const layer = root.querySelector(&#x27;.miyou-modal-layer&#x27;);
      const sheet = root.querySelector(&#x27;.miyou-birthday-sheet&#x27;);
      const cancel = root.querySelector(&#x27;.miyou-cancel&#x27;);
      const confirm = root.querySelector(&#x27;.miyou-confirm&#x27;);
      const scrim = root.querySelector(&#x27;.miyou-scrim&#x27;);
      const entryLabel = root.querySelector(&#x27;.miyou-entry-label&#x27;);
      const entryAction = root.querySelector(&#x27;.miyou-entry-action&#x27;);
      const toast = root.querySelector(&#x27;.miyou-toast&#x27;);
      let toastTimer;
      let ageCompleted = false;

        if (ageCompleted) return;

        layer.classList.remove(&#x27;is-open&#x27;);
        layer.setAttribute(&#x27;aria-hidden&#x27;, &#x27;true&#x27;);
        if (returnFocus &amp;&amp; !entry.hidden) entry.focus();

        closeSheet(false);
        entry.classList.add(&#x27;is-refreshing&#x27;);
        toast.classList.add(&#x27;is-visible&#x27;);
        window.setTimeout(() =&gt; {
          ageCompleted = true;
          entryLabel.textContent = &#x27;可能引起推迟的原因&#x27;;
          entryAction.textContent = &#x27;&#x27;;
          entryAction.classList.add(&#x27;is-chevron&#x27;);
          entry.setAttribute(&#x27;aria-label&#x27;, &#x27;可能引起推迟的原因&#x27;);

          entry.removeAttribute(&#x27;aria-controls&#x27;);
          entry.classList.remove(&#x27;is-refreshing&#x27;);

        window.clearTimeout(toastTimer);
        toastTimer = window.setTimeout(() =&gt; {
          toast.classList.remove(&#x27;is-visible&#x27;);
        }, 1800);
      };

      entry.addEventListener(&#x27;click&#x27;, openSheet);
      cancel.addEventListener(&#x27;click&#x27;, closeSheet);
      confirm.addEventListener(&#x27;click&#x27;, submitAge);
      scrim.addEventListener(&#x27;click&#x27;, closeSheet);

      root.querySelectorAll(&#x27;.miyou-wheel-column button&#x27;).forEach((button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          const column = button.closest(&#x27;.miyou-wheel-column&#x27;);
          column.querySelectorAll(&#x27;button&#x27;).forEach((item) =&gt; item.classList.remove(&#x27;is-selected&#x27;));
          button.classList.add(&#x27;is-selected&#x27;);
        });
      });

      sheet.addEventListener(&#x27;keydown&#x27;, (event) =&gt; {
        if (event.key === &#x27;Escape&#x27;) closeSheet();
      });
    })();
  &lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
