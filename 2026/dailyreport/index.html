<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>今日密报 · 自然周周报 V5.8.7</title>
  <style>:root {
  --page-bg: #f1efe8;
  --surface: #ffffff;
  --ink: #2c2c2a;
  --muted: #5f5e5a;
  --line: rgba(0, 0, 0, 0.08);
  --soft-line: rgba(0, 0, 0, 0.06);
  --today: #ff4d88;
  --period: #ff4d88;
  --period-bg: #fff2f6;
  --period-text: #c93668;
  --period-dark: #8f254a;
  --follicular: #4f7cae;
  --follicular-bg: #eef4f9;
  --follicular-text: #4f7cae;
  --follicular-dark: #365c84;
  --ovulation: #9a6cc5;
  --ovulation-bg: #f5f0fa;
  --ovulation-text: #7a4bac;
  --ovulation-dark: #57317f;
  --luteal: #b39bcc;
  --luteal-bg: #f7f3fa;
  --luteal-text: #745b8a;
  --luteal-dark: #553f69;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}


button {
  font: inherit;
}


.tab:focus-visible {
  outline: 2px solid var(--today);
  outline-offset: 2px;
}

.briefing-top {
  margin-bottom: 10px;
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, 0.55);
  border-radius: 16px 16px 0 0;
  background:
    linear-gradient(145deg, rgba(255, 255, 255, 0.82) 0%, rgba(247, 245, 239, 0.76) 52%, rgba(238, 234, 224, 0.72) 100%);
  box-shadow: 0 10px 24px rgba(84, 78, 66, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.62);
  backdrop-filter: blur(18px);
  color: var(--ink);
}

.briefing-titlebar {
  display: grid;
  grid-template-columns: 42px 1fr 42px;
  align-items: center;
  min-height: 46px;
  padding: 4px 8px 0;
}

.briefing-top--calendar {
  border-radius: 0 18px 18px 18px;
  background:
    linear-gradient(145deg, rgba(255, 255, 255, 0.9) 0%, rgba(247, 245, 238, 0.84) 100%);
}

.briefing-titlebar--calendar {
  min-height: 46px;
  padding: 4px 8px 0;
  border-bottom: 1px solid rgba(255, 255, 255, 0.7);
}

.briefing-back {
  width: 30px;
  height: 30px;
  border: 0;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.48);
  color: #8a8277;
  cursor: pointer;
  font-size: 25px;
  font-weight: 400;
  line-height: 1;
}

.briefing-back:focus-visible {
  outline: 2px solid var(--phase-bar);
  outline-offset: 2px;
}

.briefing-title {
  color: var(--phase-dark);
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 0.6px;
  text-align: center;
}

.date-nav {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 38px;
  padding: 0 8px;
}

.date-nav__range {
  flex: 0 0 auto;
  color: #9d968d;
  font-size: 10px;
  font-weight: 500;
  line-height: 1.2;
  white-space: nowrap;
}

.date-nav__item {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 2px;
  min-width: 30px;
  height: 38px;
  border: 0;
  background: transparent;
  color: #7e776f;
  cursor: pointer;
  font-size: 11px;
  font-weight: 500;
  line-height: 1.2;
  white-space: nowrap;
}

.date-nav__divider {
  color: #bbb3a9;
  font-size: 12px;
  line-height: 1;
}

.date-nav__item.is-current {
  background: color-mix(in srgb, var(--phase-bar), transparent 78%);
  border-radius: 999px;
  color: var(--phase-dark);
  font-size: 13px;
  font-weight: 700;
  padding: 0 8px;
}

.date-nav__item:focus-visible {
  outline: 2px solid var(--phase-bar);
  outline-offset: -4px;
}


.week-hero {
  background: var(--phase-bg);
  border-color: color-mix(in srgb, var(--phase-bar), transparent 75%);
}

.week-hero--with-chart {
  padding-bottom: 12px;
}

.week-hero--with-chart .week-hero__lead {
  margin-bottom: 14px;
}

.week-hero__chart {
  border-top: 0.5px solid color-mix(in srgb, var(--phase-bar), transparent 78%);
  padding-top: 14px;
}

.week-hero__chart + .week-hero__chart {
  margin-top: 14px;
}

.week-hero__chart .chart-card__head {
  margin-bottom: 4px;
}

.week-overview-card {
  background: var(--surface);
  border-color: color-mix(in srgb, var(--phase-bar), transparent 75%);
}

.week-overview-card .advice-card__title {
  margin-bottom: 10px;
}

.week-hero__top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 8px;
}

.week-hero__lead {
  display: block;
  margin-bottom: 12px;
}

.week-hero__lead.is-slide-right {
  animation: daily-lead-slide-right 360ms cubic-bezier(0.22, 0.9, 0.28, 1) both;
}

.week-hero__lead.is-slide-left {
  animation: daily-lead-slide-left 360ms cubic-bezier(0.22, 0.9, 0.28, 1) both;
}

.week-hero__chart.is-slide-right {
  animation: daily-lead-slide-right 360ms cubic-bezier(0.22, 0.9, 0.28, 1) both;
}

.week-hero__chart.is-slide-left {
  animation: daily-lead-slide-left 360ms cubic-bezier(0.22, 0.9, 0.28, 1) both;
}

.week-hero__top--stack {
  display: block;
}

.week-hero__content {
  width: 100%;
  min-width: 0;
}

.week-hero__title-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}

.today-title-card__text {
  color: var(--phase-dark);
  font-size: 15px;
  font-weight: 600;
  line-height: 1.45;
}

.period-countdown {
  display: inline-flex;
  align-items: center;
  margin-top: 5px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--phase-bar), transparent 82%);
  padding: 4px 9px;
  color: var(--phase-dark);
  font-size: 11px;
  font-weight: 650;
  line-height: 1.4;
}

.today-title-card__desc {
  margin: 4px 0 0;
  color: var(--phase-text);
  font-size: 12px;
  font-weight: 500;
  line-height: 1.55;
}

.week-hero__title {
  color: var(--phase-text);
  font-size: 11px;
  font-weight: 500;
}

.week-hero__headline {
  margin-top: 0;
  color: var(--phase-dark);
  font-size: 13px;
  font-weight: 500;
  line-height: 1.45;
}

.week-hero__summary {
  color: var(--phase-text);
  font-size: 12px;
  line-height: 1.6;
}

.tag {
  display: inline-flex;
  align-items: center;
  flex: 0 0 auto;
  border-radius: 999px;
  background: color-mix(in srgb, var(--phase-bar), transparent 70%);
  color: var(--phase-dark);
  padding: 3px 10px;
  font-size: 11px;
  font-weight: 500;
  line-height: 1.3;
  white-space: nowrap;
}

.day-strip {
  display: flex;
  gap: 4px;
  margin: 8px 0 10px;
}

.day-strip--top {
  margin: 0 0 14px;
}

.header-day-strip {
  display: flex;
  gap: 4px;
  padding: 8px 16px 16px;
  border: 0.5px solid color-mix(in srgb, var(--phase-bar), transparent 72%);
  border-top: 0;
  border-radius: 0 0 18px 18px;
  background: color-mix(in srgb, var(--phase-bar), #fff 74%);
}

.header-day-strip .day-tile {
  min-height: 58px;
  border-radius: 8px;
  padding: 6px 2px;
}

.header-day-strip .day-tile.is-today {
  border-width: 2px;
}

.header-day-strip .day-tile.is-today::after {
  inset: -4px;
  border-radius: 11px;
}

.header-day-strip .day-tile.is-switch {
  border-width: 1.5px;
}

.header-day-strip .day-tile__name {
  font-size: 9px;
}

.header-day-strip .day-tile__date {
  margin-top: 2px;
  font-size: 14px;
  line-height: 1.1;
}

.header-day-strip .day-tile__meta {
  margin-top: 2px;
  font-size: 8px;
  font-weight: 400;
}

.day-tile {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  flex: 1;
  min-width: 0;
  appearance: none;
  border: 0.5px solid var(--day-bar);
  border-radius: 8px;
  background: color-mix(in srgb, var(--day-bar), transparent 75%);
  min-height: 58px;
  padding: 6px 2px;
  text-align: center;
}

.day-tile.is-selectable {
  cursor: pointer;
}

.day-tile.is-selectable:focus-visible {
  outline: 2px solid var(--today);
  outline-offset: 2px;
}

.day-tile.is-selected {
  border: 0.5px solid var(--day-bar);
  background: color-mix(in srgb, var(--day-bar), transparent 75%);
}

.day-tile.is-selected::after {
  position: absolute;
  inset: -3px;
  border: 2px solid var(--today);
  border-radius: 11px;
  content: "";
  pointer-events: none;
}

.day-tile.is-today {
  border: 2px solid var(--today);
  background: var(--today);
  animation: today-pop 1360ms cubic-bezier(0.2, 0.9, 0.25, 1.25) both;
  box-shadow: 0 8px 18px rgba(55, 138, 221, 0.22);
}

.day-tile.is-today::after {
  position: absolute;
  inset: -4px;
  border: 1px solid rgba(55, 138, 221, 0.38);
  border-radius: 11px;
  content: "";
  pointer-events: none;
  animation: today-ring 1520ms ease-out both;
}

.day-tile.is-today-static {
  animation: none;
}

.day-tile.is-today-static::after {
  animation: none;
  opacity: 0;
}

.day-tile.is-switch {
  border: 1.5px solid var(--day-dark);
}

.day-tile__name {
  color: var(--day-dark);
  font-size: 9px;
  font-weight: 400;
  line-height: 1.2;
}

.day-tile.is-today .day-tile__name {
  color: #fff;
  font-weight: 700;
}

.day-tile__date {
  margin-top: 2px;
  color: var(--day-dark);
  font-size: 14px;
  font-weight: 600;
  line-height: 1.1;
}

.day-tile.is-today .day-tile__date {
  color: #fff;
  font-weight: 700;
}

.day-tile__meta {
  margin-top: 2px;
  color: var(--day-dark);
  font-size: 8px;
  line-height: 1.2;
}

.day-tile.is-today .day-tile__meta {
  color: #fff;
  font-size: 7px;
}

@keyframes today-pop {
  0% {
    opacity: 0;
    transform: translateY(5px) scale(0.9);
  }
  58% {
    opacity: 1;
    transform: translateY(-1px) scale(1.05);
  }
  100% {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@keyframes today-ring {
  0% {
    opacity: 0.75;
    transform: scale(0.94);
  }
  100% {
    opacity: 0;
    transform: scale(1.18);
  }
}

@keyframes daily-lead-slide-right {
  0% {
    opacity: 0;
    transform: translateX(-18px);
  }
  100% {
    opacity: 1;
    transform: translateX(0);
  }
}

@keyframes daily-lead-slide-left {
  0% {
    opacity: 0;
    transform: translateX(18px);
  }
  100% {
    opacity: 1;
    transform: translateX(0);
  }
}

.transition-card {
  background: rgba(255, 255, 255, 0.86);
  border-color: rgba(232, 230, 224, 0.9);
}

.transition-card__content {
  display: block;
}

.transition-card__title {
  margin-bottom: 4px;
  color: var(--ink);
  font-size: 11px;
  font-weight: 500;
}

.transition-card__copy {
  color: #5f5e5a;
  font-size: 12px;
  line-height: 1.6;
}

.cycle-wheel {
  justify-self: end;
  width: 118px;
  max-width: 100%;
}

.cycle-wheel__image {
  display: block;
  width: 100%;
  height: auto;
}

.chart-card__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 8px;
}

.chart-card__title {
  color: var(--ink);
  font-size: 13px;
  font-weight: 500;
}

.chart-card__badge {
  border-radius: 999px;
  background: var(--ovulation-bg);
  color: var(--ovulation-text);
  padding: 3px 10px;
  font-size: 11px;
  font-weight: 500;
  white-space: nowrap;
}

.chart-card__badge.is-luteal {
  background: var(--luteal-bg);
  color: var(--luteal-text);
}

.chart-card__badge.is-menstrual {
  background: #E39997;
  color: #FFFFFF;
}

.chart-card__badge.is-flow {
  background: var(--period-bg);
  color: var(--period-text);
}

.advice-card {
  padding: 16px;
}

.advice-card__title {
  margin: 0 0 12px;
  color: var(--ink);
  font-size: 13px;
  font-weight: 600;
}

.advice-section + .advice-section {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 0.5px solid var(--soft-line);
}

.section-card__head {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 8px;
}

.section-card__marker {
  width: 8px;
  height: 8px;
  flex: 0 0 auto;
  border-radius: 50%;
  background: var(--phase-bar);
}

.section-card__range {
  color: var(--phase-dark);
  font-size: 12px;
  font-weight: 500;
}

.seg {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  border-bottom: 0.5px solid var(--soft-line);
  padding: 9px 0;
}

.seg:last-child {
  border-bottom: none;
}

.seg__dot {
  width: 8px;
  height: 8px;
  flex: 0 0 auto;
  margin-top: 4px;
  border-radius: 50%;
  background: var(--phase-bar);
}

.seg__copy {
  color: var(--ink);
  font-size: 12px;
  line-height: 1.6;
}

.next-card {
  border: 0.5px solid var(--line);
  padding: 16px;
}

.next-card__copy {
  color: var(--ink);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.75;
}

svg {
  display: block;
}

.chart-today-mark {
  animation: chart-today-pop 1200ms cubic-bezier(0.2, 0.9, 0.25, 1.2) both;
  transform-box: fill-box;
  transform-origin: center;
}

.chart-today-line,
.chart-today-badge,
.chart-today-label {
  animation: chart-today-fade 1200ms ease-out both;
}

.chart-today-badge {
  filter: drop-shadow(0 4px 8px rgba(55, 138, 221, 0.2));
}

@keyframes chart-today-pop {
  0% {
    opacity: 0;
    transform: scale(0.6);
  }
  52% {
    opacity: 1;
    transform: scale(1.16);
  }
  100% {
    opacity: 1;
    transform: scale(1);
  }
}

@keyframes chart-today-fade {
  0% {
    opacity: 0;
    transform: translateY(7px);
  }
  56% {
    opacity: 1;
    transform: translateY(0);
  }
  100% {
    opacity: 1;
    transform: translateY(-3px);
  }
}

@supports not (color: color-mix(in srgb, #000, #fff)) {
  .week-hero,
  .week-overview-card {
    border-color: var(--phase-bar);
  }

  .tag,
  .day-tile {
    background: #f4f0e9;
  }

  .transition-card {
    border-color: var(--ovulation);
  }
}




/* V5.0：月经概率与白带分类散点图 */
.day-tile.is-predicted:not(.is-today) {
  border-style: dashed;
  background: color-mix(in srgb, var(--day-bar), transparent 84%);
}

.day-tile.is-delayed:not(.is-today) {
  border-style: dashed;
  background: color-mix(in srgb, var(--day-bar), transparent 86%);
}

.day-tile.is-predicted .day-tile__meta,
.day-tile.is-delayed .day-tile__meta {
  font-weight: 600;
}

.forecast-note,
.delay-note {
  margin-top: 8px;
  color: #817a72;
  font-size: 10px;
  line-height: 1.55;
}

.delay-state {
  padding: 4px 0 2px;
}

.delay-state__summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 14px;
}

.delay-state__label {
  color: var(--phase-text);
  font-size: 11px;
}

.delay-state__count {
  color: var(--phase-dark);
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.5px;
}

.delay-timeline {
  position: relative;
  display: grid;
  grid-template-columns: 1fr 1fr;
  align-items: start;
  gap: 20px;
  padding-top: 14px;
}

.delay-timeline::before {
  position: absolute;
  top: 18px;
  right: 8px;
  left: 8px;
  height: 2px;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--period) 0%, var(--phase-bar) 100%);
  content: "";
}

.delay-timeline__point {
  position: relative;
  z-index: 1;
}

.delay-timeline__point:last-child {
  text-align: right;
}

.delay-timeline__dot {
  display: block;
  width: 10px;
  height: 10px;
  margin-bottom: 7px;
  border: 2px solid #fff;
  border-radius: 50%;
  background: var(--period);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--period), transparent 45%);
}

.delay-timeline__point:last-child .delay-timeline__dot {
  margin-left: auto;
  background: var(--phase-bar);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--phase-bar), transparent 45%);
}

.delay-timeline__name {
  color: #8b847c;
  font-size: 9px;
}

.delay-timeline__date {
  margin-top: 2px;
  color: var(--ink);
  font-size: 11px;
  font-weight: 600;
}

.uncertainty-card {
  margin-top: 12px;
  border-radius: 10px;
  background: color-mix(in srgb, var(--phase-bar), transparent 86%);
  padding: 9px 10px;
  color: var(--phase-text);
  font-size: 10px;
  line-height: 1.55;
}

.delay-brief {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 10px;
  border-radius: 10px;
  background: color-mix(in srgb, var(--phase-bar), transparent 88%);
  padding: 8px 10px;
}

.delay-brief__date {
  color: var(--phase-text);
  font-size: 10px;
  line-height: 1.45;
}

.delay-brief__count {
  flex: 0 0 auto;
  color: var(--phase-dark);
  font-size: 15px;
  font-weight: 700;
}

.delay-questions {
  display: grid;
  gap: 8px;
}

.delay-question {
  display: grid;
  grid-template-columns: 22px minmax(0, 1fr);
  gap: 8px;
  border: 0.5px solid color-mix(in srgb, var(--phase-bar), transparent 72%);
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.5);
  padding: 9px 10px;
}

.delay-question__index {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--phase-bar);
  color: #fff;
  font-size: 10px;
  font-weight: 700;
}

.delay-question__title {
  color: var(--phase-dark);
  font-size: 11px;
  font-weight: 650;
  line-height: 1.35;
}

.delay-question__copy {
  margin-top: 2px;
  color: #625d57;
  font-size: 10px;
  line-height: 1.55;
}

.delay-tip {
  border: 0.5px solid color-mix(in srgb, var(--phase-bar), transparent 68%);
  border-radius: 12px;
  background: color-mix(in srgb, var(--phase-bar), #fff 91%);
  padding: 12px 13px;
}

.delay-tip__title {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 6px;
  color: var(--phase-dark);
  font-size: 12px;
  font-weight: 700;
}

.delay-tip__icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--phase-bar);
  color: #fff;
  font-size: 12px;
}

.delay-tip__copy {
  margin: 0;
  color: #625d57;
  font-size: 12px;
  line-height: 1.6;
}

/* V5.0：场景按钮外置的单层固定手机画布 */
:root {
  --my-brand-red: #ff4d88;
  --my-brand-soft: rgba(255, 77, 136, 0.08);
  --my-bg: #f2f2f5;
  --my-surface: #ffffff;
  --my-text-primary: #323232;
  --my-text-secondary: #666666;
  --my-text-tertiary: #999999;
  --my-line: rgba(0, 0, 0, 0.08);
  --my-link: #4f7cae;
  --my-radius-xs: 4px;
  --my-radius-sm: 8px;
  --my-radius-md: 12px;
  --my-radius-pill: 999px;
  --page-bg: var(--my-bg);
  --surface: var(--my-surface);
  --ink: var(--my-text-primary);
  --muted: var(--my-text-secondary);
  --line: var(--my-line);
  --soft-line: var(--my-line);

    return todayIndex >= 0 ? todayIndex : 0;
  }

  function getSelectedDayIndex(week) {
    return selectedDayByWeek[week.id] ?? getDefaultDayIndex(week);
  }

  function isSelectableDay(week, index) {
    return week.selectableDayIndices?.includes(index) || Boolean(week.dayStates?.[index]);
  }

  function getDisplayWeek(week) {
    if (!week.selectableDayIndices?.length && !week.dayStates) return week;

    const selectedIndex = getSelectedDayIndex(week);
    const todayIndex = getDefaultDayIndex(week);
    const state = week.dayStates?.[selectedIndex];
    const stateHasDelayData = Boolean(state) && Object.prototype.hasOwnProperty.call(state, "delayData");

    return {
      ...week,
      topTitle: state?.topTitle ?? week.topTitle,
      topDescription: state?.topDescription ?? week.topDescription,
      heroPhase: state?.heroPhase ?? week.heroPhase,
      leadAnimation: selectedDayAnimationByWeek[week.id] || state?.leadAnimation || week.leadAnimation,
      mergeIntroWithFlow: state?.mergeIntroWithFlow ?? week.mergeIntroWithFlow,
      mergeIntroWithCharts: state?.mergeIntroWithCharts ?? week.mergeIntroWithCharts,
      mergeIntroWithForecast: state?.mergeIntroWithForecast ?? week.mergeIntroWithForecast,
      mergeIntroWithDelay: state?.mergeIntroWithDelay ?? week.mergeIntroWithDelay,
      showPregChart: state?.showPregChart ?? week.showPregChart,
      showChart: state?.showChart ?? week.showChart,
      menstrualTodayDay: state?.menstrualTodayDay ?? week.menstrualTodayDay,
      menstrualTodayProb: state?.menstrualTodayProb ?? week.menstrualTodayProb,
      predictedStartLutealDay: state?.predictedStartLutealDay ?? null,
      periodCountdown: state?.periodCountdown ?? week.periodCountdown,
      periodEndCountdown: state?.periodEndCountdown ?? week.periodEndCountdown,
      delayTip: state?.delayTip ?? week.delayTip,
      flowData: state?.flowData ?? week.flowData,
      menstrualDateOffset: state?.menstrualDateOffset ?? week.menstrualDateOffset,
      menstrualRangeStart: state?.menstrualRangeStart ?? week.menstrualRangeStart,
      menstrualRangeEnd: state?.menstrualRangeEnd ?? week.menstrualRangeEnd,
      menstrualNextPhaseStart: state?.menstrualNextPhaseStart ?? week.menstrualNextPhaseStart,
      forecastData: state?.forecastData
        ? { ...week.forecastData, ...state.forecastData }
        : week.forecastData,
      delayData: stateHasDelayData
        ? (state.delayData ? { ...week.delayData, ...state.delayData } : null)
        : week.delayData,
      days: week.days.map((day, index) => ({
        ...day,
        today: index === todayIndex,
        selected: index === selectedIndex,
        selectable: isSelectableDay(week, index),
        suppressTodayAnimation: suppressTodayAnimationByWeek[week.id] && index === todayIndex,
      })),
      pregData: state?.pregData === null
        ? null
        : state?.pregData
        ? { ...week.pregData, ...state.pregData }
        : week.pregData,
    };
  }

  function renderDay(day, dateInfo, options = {}) {
    const classes = [
      "day-tile",
      day.today ? "is-today" : "",
      day.suppressTodayAnimation ? "is-today-static" : "",
      day.selected ? "is-selected" : "",
      day.switch ? "is-switch" : "",
      day.predicted ? "is-predicted" : "",
      day.delayed ? "is-delayed" : "",
      day.selectable ? "is-selectable" : "",
    ].filter(Boolean).join(" ");

    const weekdayLabel = day.today ? "今天" : day.d;
    const fullDate = dateInfo ? `${dateInfo.month}/${dateInfo.day}` : "";
    const content = `<div class="day-tile__name">${weekdayLabel}</div>
      ${fullDate ? `<div class="day-tile__date">${fullDate}</div>` : ""}`;

    if (day.selectable) {
      return `<button class="${classes}" type="button" style="${dayStyle(day)}" data-day-select="${options.weekId}" data-day-index="${options.dayIndex}" aria-pressed="${day.selected ? "true" : "false"}" aria-current="${day.today ? "date" : "false"}" aria-label="切换到${day.d}">
        ${content}
      </button>`;
    }

    return `<div class="${classes}" style="${dayStyle(day)}">
      ${content}
    </div>`;
  }

  function renderBriefingHeader(week) {
    return `<header class="briefing-top briefing-top--calendar">
      <div class="briefing-titlebar briefing-titlebar--calendar">
        <button class="briefing-back" type="button" aria-label="返回">‹</button>
        <div class="briefing-title">本周密报</div>
        <span class="briefing-titlebar__space" aria-hidden="true"></span>
      </div>
    </header>`;
  }

  function renderDateSwitcher(week) {
    const activeDay = week.days.find((day) => day.selected) || week.days.find((day) => day.today) || week.days[0];
    const activePhase = phases[activeDay?.ph || week.dominant];
    const weekDates = getWeekDates(week);
    const dayStrip = `<div class="header-day-strip">${week.days.map((day, index) => renderDay(day, weekDates[index], { weekId: week.id, dayIndex: index })).join("")}</div>`;

    return `<div class="daily-date-switcher" style="${phaseStyle(activePhase)};--week-gradient:${buildWeekGradient(week)}" aria-label="切换日期查看当日内容">
      ${dayStrip}
    </div>`;
  }

    return `<div class="chart-card__head">
        <span class="chart-card__title">经期开始预测</span>
        <span class="chart-card__badge is-menstrual">预测</span>
      </div>
      <div id="forecastChart_${week.id}"></div>
      <p class="forecast-note">经期开始时间基于历史周期估算，实际日期可能提前或推后；新的月经记录会用于更新后续周期。</p>`;
  }

  function renderDelayContent(week) {
    if (!week.delayData) return "";
    return `<div class="delay-tip">
        <div class="delay-tip__title">
          <span class="delay-tip__icon">i</span>
          <span>推迟期小贴士</span>
        </div>
        <p class="delay-tip__copy">${week.delayTip || "月经日期来自历史周期预测，每个周期出现几天波动并不少见。"}</p>
      </div>`;
  }
  function renderPregnancyChartContent(week) {
    if (!week.showPregChart || !week.pregData) return "";
    const chartTitle = "怀孕几率与白带类型";

    return `<div class="chart-card__head">
        <span class="chart-card__title">${chartTitle}</span>
      </div>
      <div id="pregChart_${week.id}"></div>`;
  }

  function renderPregnancyChartCard(week) {
    if (!week.showPregChart || !week.pregData || week.mergeIntroWithCharts) return "";

    return `<article class="card chart-card">
      ${renderPregnancyChartContent(week)}
    </article>`;
  }

  function renderMenstrualChartContent(week) {
    if (!week.showChart) return "";
    const todayProb = week.menstrualTodayProb ?? 4;

    return `<div class="chart-card__head">
        <span class="chart-card__title">预测月经概率</span>
      </div>
      <div id="menChart_${week.id}"></div>`;
  }

  function renderMenstrualChartCard(week) {
    if (!week.showChart || week.mergeIntroWithCharts) return "";

    return `<article class="card chart-card">
      ${renderMenstrualChartContent(week)}
    </article>`;
  }

  function renderFlowChartContent(week) {
    if (!week.flowData) return "";

    return `<div class="chart-card__head">
        <span class="chart-card__title">经血量分布</span>
      </div>
      <div id="flowChart_${week.id}"></div>`;
  }

  function renderFlowChartCard(week) {
    if (!week.flowData || week.mergeIntroWithFlow) return "";

    return `<article class="card chart-card">
      ${renderFlowChartContent(week)}
    </article>`;
  }

  function getAdviceType(action) {
    const text = typeof action === "string" ? action : action?.text || "";
    if (/咨询医生|异常出血|明显腹痛|长期未到|反复推迟|不适/.test(text)) return "健康提醒";
    if (/记录|经量|疼痛变化|实际阶段|重新计算|预测/.test(text)) return "生活建议";
    if (/睡眠|作息|熬夜|休息|疲惫|放慢节奏/.test(text)) return "睡眠建议";
    if (/运动|散步|拉伸|活动|恢复正常节奏/.test(text)) return "运动建议";
    if (/饮食|水分|铁质|红肉|菠菜|红枣|补充能量|食欲/.test(text)) return "饮食建议";
    if (/情绪|压力|紧张|放松|烦躁|心情/.test(text)) return "情绪建议";
    if (/保暖|热敷|下腹|腰腹/.test(text)) return "生活建议";
    if (/白带|皮肤|身体信号|真实感受/.test(text)) return "身体观察";
    return "生活建议";
  }

  function renderSection(section, hideHead = false) {
    const phase = phases[section.ph];
    const actions = section.actions.map((action) => {
      const copy = typeof action === "string" ? action : action.text;
      const type = typeof action === "string" ? getAdviceType(action) : action.type || getAdviceType(action);
      return `<div class="seg">
        <span class="advice-type">${type}</span>
        <span class="seg__copy">${copy}</span>
      </div>`;
    }).join("");

    return `<section class="advice-section section-card" style="${phaseStyle(phase)}">
      ${hideHead ? "" : `<div class="section-card__head">
        <span class="section-card__marker"></span>
        <span class="section-card__range">${section.range}</span>
      </div>`}
      ${actions}
    </section>`;
  }

  function renderModuleTitle(title, type) {
    const icons = {
      overview: `<svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M3 12.5V8.5M8 12.5V3.5M13 12.5V6" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M2.5 13.25H13.5" stroke-width="1.4" stroke-linecap="round"/>
      </svg>`,
      advice: `<svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M5.5 11.25H10.5M6.25 13H9.75" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M4.25 6.8A3.75 3.75 0 1 1 11.75 6.8C11.75 8.1 11.1 8.85 10.35 9.55C9.85 10 9.65 10.35 9.6 11.25H6.4C6.35 10.35 6.15 10 5.65 9.55C4.9 8.85 4.25 8.1 4.25 6.8Z" stroke-width="1.5" stroke-linejoin="round"/>
      </svg>`,
      next: `<svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <rect x="2.5" y="3.5" width="11" height="10" rx="2" stroke-width="1.4"/>
        <path d="M5 2.5V5M11 2.5V5M2.75 6.25H13.25M6 9H10.25M8.75 7.5L10.25 9L8.75 10.5" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>`
    };

    return `<h2 class="advice-card__title module-title module-title--${type}">
      <span class="module-title__icon" aria-hidden="true">${icons[type]}</span>
      <span>${title}</span>
    </h2>`;
  }

  function renderAdviceCard(week) {
    if (!week.sections?.length) return "";
    const hideSectionHeads = false;

    return `<article class="card advice-card">
      ${renderModuleTitle("本周建议", "advice")}
      ${week.sections.map((section) => renderSection(section, hideSectionHeads)).join("")}
    </article>`;
  }

  function renderNextWeek(week) {
    return `<article class="card next-card">
      ${renderModuleTitle("下周预告", "next")}
      <p class="next-card__copy">${week.nextWeek}</p>
    </article>`;
  }

  function renderWeekOverviewCard(week) {
    if (!week.showOverviewCard) return "";
    const dominant = phases[week.dominant];

    return `<article class="card week-overview-card" style="${phaseStyle(dominant)}">
      <div class="module-title-row">
        ${renderModuleTitle("本周概况", "overview")}
        <span class="tag week-overview-card__tag">${week.subtitle}</span>
      </div>
      <h1 class="week-hero__headline">${week.headline}</h1>
      <p class="week-hero__summary">${week.summary}</p>
    </article>`;
  }

  function formatStageTitle(title) {
    if (!title) return "";

    return title
      .replace(/^今天是经期第(\d+)天$/, "月经期 第$1天")
      .replace(/^今天是卵泡期第(\d+)天$/, "卵泡期 第$1天")
      .replace(/^今天是排卵期第(\d+)天$/, "排卵期 第$1天")
      .replace(/^今天是黄体期第(\d+)天$/, "黄体期 第$1天")
      .replace(/^预计今天是经期第(\d+)天$/, "预测经期 第$1天")
      .replace(/^预计今天是经期结束日$/, "预测经期 第5天");
  }

  function renderWeekHeroIntro(week) {
    const tag = `<span class="tag">${week.subtitle}</span>`;
    const weekDates = getWeekDates(week);
    const shouldShowDayStrip = false;
    const dayStripClass = `day-strip${week.dayStripPosition === "top" ? " day-strip--top" : ""}`;
    const dayStrip = shouldShowDayStrip ? `<div class="${dayStripClass}">${week.days.map((day, index) => renderDay(day, weekDates[index], { weekId: week.id, dayIndex: index })).join("")}</div>` : "";
    const titleBlock = `<div class="week-hero__content">
      <div class="week-hero__title-row">
        <div class="week-hero__title">${week.title}</div>
        ${tag}
      </div>
      ${week.dayStripPosition === "top" || !shouldShowDayStrip ? "" : dayStrip}
      <h1 class="week-hero__headline">${week.headline}</h1>
    </div>`;

    if (!week.topTitle) {
      return titleBlock;
    }

    const leadClass = `week-hero__lead${week.leadAnimation ? ` is-${week.leadAnimation}` : ""}`;
    const predictedStartToday = Number.isFinite(week.predictedStartLutealDay);
    const predictedEndToday = /^预计今天是经期结束日$/.test(week.topTitle);
    const actualPeriodDayMatch = week.topTitle.match(/^今天是经期第(\d+)天$/);
    const actualPeriodDay = Boolean(actualPeriodDayMatch);
    const actualPeriodDayNumber = actualPeriodDayMatch ? Number(actualPeriodDayMatch[1]) : null;
    const displayTopTitle = predictedStartToday
      ? `黄体期 第${week.predictedStartLutealDay}天`
      : formatStageTitle(week.topTitle);
    const countdownText = predictedStartToday
      ? "预测今天月经开始"
      : predictedEndToday
        ? "预测今天月经结束"
        : actualPeriodDay && actualPeriodDayNumber >= 2 && week.periodEndCountdown?.days > 0
          ? `距离月经结束（${week.periodEndCountdown.date}）还有${week.periodEndCountdown.days}天`
          : !actualPeriodDay && week.periodCountdown
            ? `距月经开始（${week.periodCountdown.date}）还有${week.periodCountdown.days}天`
            : "";

    return `${week.dayStripPosition === "top" && shouldShowDayStrip ? dayStrip : ""}
    <div class="${leadClass}">
      <div class="today-title-card__text">${displayTopTitle}</div>
      ${countdownText ? `<div class="period-countdown">${countdownText}</div>` : ""}
      ${week.topDescription ? `<p class="today-title-card__desc">${week.topDescription}</p>` : ""}
    </div>
    ${week.showOverviewCard ? "" : `<div class="week-hero__top week-hero__top--stack">
      ${titleBlock}
    </div>`}`;
  }

  function renderHeroCard(week, dominant) {
    const chartBlocks = [];
    if (week.mergeIntroWithFlow) chartBlocks.push(renderFlowChartContent(week));
    if (week.mergeIntroWithForecast) chartBlocks.push(renderForecastContent(week));
    if (week.mergeIntroWithDelay) chartBlocks.push(renderDelayContent(week));
    if (week.mergeIntroWithCharts) {
      chartBlocks.push(renderMenstrualChartContent(week));
      chartBlocks.push(renderPregnancyChartContent(week));
    }
    const chartClass = `week-hero__chart${week.leadAnimation ? ` is-${week.leadAnimation}` : ""}`;
    const charts = chartBlocks.filter(Boolean).map((chart) => `<div class="${chartClass}">${chart}</div>`).join("");
    const hasMergedChart = Boolean(charts);

    return `<article class="card week-hero${hasMergedChart ? " week-hero--with-chart" : ""}" style="${phaseStyle(dominant)}">
      ${renderWeekHeroIntro(week)}
      ${week.showOverviewCard ? "" : `<p class="week-hero__summary">${week.summary}</p>`}
      ${charts}
    </article>`;
  }

  function renderWeek(week) {
    const heroDominant = phases[week.heroPhase || week.dominant];
    const menstrualChart = renderMenstrualChartCard(week);
    const pregnancyChart = renderPregnancyChartCard(week);
    const showMenstrualChartBeforeSections = week.id === "d";
    const showPregnancyChartAfterMenstrual = week.id === "d";
    const dailyCharts = showMenstrualChartBeforeSections
      ? `${menstrualChart}${showPregnancyChartAfterMenstrual ? pregnancyChart : ""}${renderFlowChartCard(week)}`
      : `${showPregnancyChartAfterMenstrual ? "" : pregnancyChart}${renderFlowChartCard(week)}${menstrualChart}`;

    return `${renderBriefingHeader(week)}
    <section class="daily-zone" aria-label="所选日期内容" style="${phaseStyle(heroDominant)}">
      ${renderDateSwitcher(week)}
      ${renderHeroCard(week, heroDominant)}
      ${dailyCharts}
    </section>
    <section class="weekly-zone" aria-label="本周内容">
      ${renderWeekOverviewCard(week)}
      ${renderAdviceCard(week)}
      ${renderNextWeek(week)}
    </section>`;
  }

  function syncTabs() {
    document.querySelectorAll(".tab").forEach((tab) => {
      const active = tab.dataset.id === currentId;

      tab.style.background = active ? "#ff4d88" : "transparent";
      tab.style.color = active ? "#ffffff" : "rgba(255,255,255,0.82)";
      tab.style.borderColor = active ? "#ff4d88" : "rgba(255,255,255,0.18)";
      tab.setAttribute("aria-selected", String(active));
    });
  }

  function switchTab(id) {
    const week = weeks.find((item) => item.id === id);
    if (!week) return;

    currentId = id;
    selectedDayAnimationByWeek[id] = "";
    suppressTodayAnimationByWeek[id] = false;
    syncTabs();
    mountWeek(week);
  }

  function mountWeek(week) {
    const displayWeek = getDisplayWeek(week);
    const id = displayWeek.id;

    panelEl.innerHTML = renderWeek(displayWeek);
    bindDaySelectors(week);

    requestAnimationFrame(() => {
      if (displayWeek.flowData) renderFlowChart(displayWeek.flowData, `flowChart_${id}`);
      if (displayWeek.forecastData) renderForecastChart(displayWeek.forecastData, `forecastChart_${id}`);
      if (displayWeek.showPregChart && displayWeek.pregData) renderPregChart(displayWeek.pregData, `pregChart_${id}`);
      if (displayWeek.showChart) renderMenstrualChart(
        `menChart_${id}`,
        displayWeek.menstrualTodayDay ?? 23,
        displayWeek.menstrualTodayProb,
        displayWeek.menstrualDateOffset ?? 0,
        displayWeek.menstrualRangeStart ?? 19,
        displayWeek.menstrualRangeEnd ?? 29,
        displayWeek.menstrualNextPhaseStart ?? 35,
      );
    });
  }

  function bindDaySelectors(week) {
    panelEl.querySelectorAll("[data-day-select]").forEach((button) => {
      button.addEventListener("click", () => {
        const nextIndex = Number(button.dataset.dayIndex);
        const currentIndex = getSelectedDayIndex(week);
        selectedDayAnimationByWeek[week.id] = nextIndex > currentIndex
          ? "slide-left"
          : nextIndex < currentIndex
            ? "slide-right"
            : "";
        selectedDayByWeek[week.id] = nextIndex;
        suppressTodayAnimationByWeek[week.id] = true;
        mountWeek(week);
      });
    });
  }

  function initTabs() {
    weeks.forEach((week) => {
      const button = document.createElement("button");
      button.className = "tab";
      button.type = "button";
      button.dataset.id = week.id;
      button.textContent = week.tabLabel;
      button.setAttribute("role", "tab");
      button.addEventListener("click", () => switchTab(week.id));
      tabsEl.appendChild(button);
    });
  }

  initTabs();
  switchTab(currentId);
})();
</script>
<script>
(function () {
  const stage = document.querySelector('.preview-stage');
  function fitStage() {
    const scale = Math.min(window.innerWidth / 537, window.innerHeight / 852, 1);
    stage.style.setProperty('--preview-scale', String(scale));
  }
  window.addEventListener('resize', fitStage, { passive: true });
  fitStage();
})();
</script>
</body>
</html>
