.day-tile {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  flex: 1;
  min-width: 0;
  appearance: none;
  border: 0.5px solid var(--day-bar);
  border-radius: 8px;
  background: color-mix(in srgb, var(--day-bar), transparent 75%);
  min-height: 58px;
  padding: 6px 2px;
  text-align: center;
}

.day-tile.is-selectable {
  cursor: pointer;

.day-tile.is-selectable:focus-visible {
  outline: 2px solid var(--today);
  outline-offset: 2px;
}

.day-tile.is-selected {
  border: 0.5px solid var(--day-bar);
  background: color-mix(in srgb, var(--day-bar), transparent 75%);

.day-tile.is-selected::after {
  position: absolute;
  inset: -3px;
  border: 2px solid var(--today);
  border-radius: 11px;
  content: &quot;&quot;;

@keyframes today-pop {

  58% {

  100% {

svg {

}

}

.delay-timeline__dot {
  display: block;
  width: 10px;
  height: 10px;
  margin-bottom: 7px;
  border: 2px solid #fff;
  border-radius: 50%;
  background: var(--period);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--period), transparent 45%);

.delay-timeline__point:last-child .delay-timeline__dot {

  box-shadow: 0 0 0 2px color-mix(in srgb, var(--phase-bar), transparent 45%);

  font-size: 9px;
}

  color: var(--ink);
  font-size: 11px;
  font-weight: 600;
}

  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--phase-bar);
  color: #fff;
  font-size: 10px;
  font-weight: 700;
}

.delay-question__title {
  color: var(--phase-dark);
  font-size: 11px;
  font-weight: 650;
  line-height: 1.35;
}

.delay-question__copy {
  margin-top: 2px;
  color: #625d57;
  font-size: 10px;
  line-height: 1.55;
}

.delay-tip {
  border: 0.5px solid color-mix(in srgb, var(--phase-bar), transparent 68%);
  border-radius: 12px;
  background: color-mix(in srgb, var(--phase-bar), #fff 91%);
  padding: 12px 13px;
}

.delay-tip__title {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 6px;
  color: var(--phase-dark);
  font-size: 12px;
  font-weight: 700;
}

.delay-tip__icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--phase-bar);
  color: #fff;
  font-size: 12px;
}

.delay-tip__copy {
  margin: 0;
  color: #625d57;
  font-size: 12px;
  line-height: 1.6;
}

  &lt;script&gt;(function () {
  const { phases } = window.DailyBriefingData;

  function sanitizeId(value) {
    return String(value).replace(/[^a-z0-9]/gi, &quot;_&quot;);
  }

  function drawBarChart(values, colors, labels, maxVal, todayIdx, containerId, phaseDefs) {
    const W = 343;
    const H = 110;
    const padL = 28;
    const padR = 4;
    const padT = 8;
    const padB = 22;
    const n = values.length;
    const bw = Math.floor((W - padL - padR) / n);
    const chartH = H - padT - padB;
    let bars = &quot;&quot;;
    let text = &quot;&quot;;
    let yLines = &quot;&quot;;

    [0, Math.round(maxVal / 2), maxVal].forEach((v) =&gt; {
      const y = padT + chartH - (v / maxVal) * chartH;
      yLines += `&lt;line x1=&quot;${padL}&quot; x2=&quot;${W - padR}&quot; y1=&quot;${y}&quot; y2=&quot;${y}&quot; stroke=&quot;#e8e6e0&quot; stroke-width=&quot;0.5&quot;/&gt;`;
      text += `&lt;text x=&quot;${padL - 3}&quot; y=&quot;${y + 3}&quot; text-anchor=&quot;end&quot; font-size=&quot;8&quot; fill=&quot;#aaa&quot;&gt;${v}%&lt;/text&gt;`;
    });

    values.forEach((v, i) =&gt; {
      const bh = Math.max((v / maxVal) * chartH, v &gt; 0 ? 2 : 0);
      const x = padL + i * bw + 1;
      const y = padT + chartH - bh;
      bars += `&lt;rect class=&quot;${i === todayIdx ? &quot;chart-today-mark&quot; : &quot;&quot;}&quot; x=&quot;${x}&quot; y=&quot;${y}&quot; width=&quot;${bw - 2}&quot; height=&quot;${bh}&quot; rx=&quot;2&quot; fill=&quot;${colors[i]}&quot;/&gt;`;

      if (i === todayIdx) {
        const badgeY = Math.max(padT + 2, y - 18);
        bars += `&lt;line class=&quot;chart-today-line&quot; x1=&quot;${x + bw / 2 - 1}&quot; x2=&quot;${x + bw / 2 - 1}&quot; y1=&quot;${padT}&quot; y2=&quot;${padT + chartH}&quot; stroke=&quot;#378ADD&quot; stroke-width=&quot;1&quot; stroke-dasharray=&quot;3,2&quot;/&gt;`;
        bars += `&lt;rect class=&quot;chart-today-badge&quot; x=&quot;${x - 2}&quot; y=&quot;${badgeY}&quot; width=&quot;28&quot; height=&quot;14&quot; rx=&quot;4&quot; fill=&quot;#378ADD&quot;/&gt;`;
        bars += `&lt;text class=&quot;chart-today-label&quot; x=&quot;${x + 12}&quot; y=&quot;${badgeY + 10}&quot; text-anchor=&quot;middle&quot; font-size=&quot;8&quot; fill=&quot;#fff&quot; font-weight=&quot;600&quot;&gt;${v}%&lt;/text&gt;`;
      }
    });

    labels.forEach((label, i) =&gt; {
      if (!label) return;

      const x = padL + i * bw + bw / 2 - 1;
      text += `&lt;text x=&quot;${x}&quot; y=&quot;${H - 4}&quot; text-anchor=&quot;middle&quot; font-size=&quot;8&quot; fill=&quot;${i === todayIdx ? &quot;#378ADD&quot; : &quot;#aaa&quot;}&quot;&gt;${label}&lt;/text&gt;`;
    });

    let phaseBar = &quot;&quot;;
    let phaseLabels = &quot;&quot;;
    if (phaseDefs) {
      const barY = H + 2;
      const barH = 6;
      phaseDefs.forEach((p) =&gt; {
        const x1 = padL + p.start * bw;
        const x2 = padL + (p.end + 1) * bw - padR;
        const width = x2 - x1;
        phaseBar += `&lt;rect x=&quot;${x1}&quot; y=&quot;${barY}&quot; width=&quot;${width}&quot; height=&quot;${barH}&quot; fill=&quot;${p.color}&quot;/&gt;`;
        phaseLabels += `&lt;text x=&quot;${x1 + width / 2}&quot; y=&quot;${barY + barH + 9}&quot; text-anchor=&quot;middle&quot; font-size=&quot;8&quot; fill=&quot;#888&quot;&gt;${p.label}&lt;/text&gt;`;
      });
    }

    const totalH = phaseDefs ? H + 20 : H;
    const el = document.getElementById(containerId);
    if (!el) return;

    el.innerHTML = `&lt;svg width=&quot;100%&quot; viewBox=&quot;0 0 ${W} ${totalH}&quot; xmlns=&quot;http://www.w3.org/2000/svg&quot; role=&quot;img&quot; aria-label=&quot;预测月经概率图&quot;&gt;${yLines}${bars}${text}${phaseBar}${phaseLabels}&lt;/svg&gt;`;
  }

  function renderPregChart(data, containerId) {
    const W = 343;
    const H = 110;
    const hasDischarge = Array.isArray(data.dischargeValues) &amp;&amp; data.dischargeValues.length &gt; 0;
    const padL = 28;
    const padR = hasDischarge ? 24 : 4;
    const padT = 8;
    const padB = 22;
    const cyclePhaseKeys = [&quot;period&quot;, &quot;follicular&quot;, &quot;ovulation&quot;, &quot;luteal&quot;];
    const labels = data.phaseAxis
      ? data.stageLabels || cyclePhaseKeys.map((key) =&gt; phases[key].label)
      : data.labels;
    const probs = data.phaseAxis ? data.stageProbs || data.probs : data.probs;
    const todayIdx = data.phaseAxis ? data.todayStageIdx : data.todayIdx;
    const n = labels.length;
    const chartH = H - padT - padB;
    const maxVal = 35;
    const xStep = (W - padL - padR) / (n - 1);
    const stageDurations = data.phaseAxis ? data.stageDurations || [5, 8, 1, 14] : null;
    const stageTotal = stageDurations ? stageDurations.reduce((sum, value) =&gt; sum + value, 0) : 0;
    const stageSpan = W - padL - padR;
    let durationCursor = padL;
    const stageRanges = stageDurations
      ? stageDurations.map((duration) =&gt; {
          const width = (duration / stageTotal) * stageSpan;
          const range = { x1: durationCursor, x2: durationCursor + width };
          durationCursor += width;
          return range;
        })
      : null;
    const satIdx = labels.indexOf(&quot;周六&quot;);
    const phaseDefs = data.phaseAxis
      ? labels.map((label, index) =&gt; {
          const phaseKey = data.stagePhaseKeys?.[index] || cyclePhaseKeys[index] || &quot;follicular&quot;;
          const phase = phases[phaseKey] || phases.follicular;
          return { label, color: phase.bar, s: index, e: index, ...stageRanges[index] };
        })
      : Array.isArray(data.phaseSegments) &amp;&amp; data.phaseSegments.length
      ? data.phaseSegments.map((segment) =&gt; {
          const phase = phases[segment.ph] || phases.follicular;
          return { label: phase.label, color: phase.bar, s: segment.start, e: segment.end };
        })
      : satIdx &gt; 0
        ? [
            { label: phases.follicular.label, color: phases.follicular.bar, s: 0, e: satIdx - 1 },
            { label: phases.ovulation.label, color: phases.ovulation.bar, s: satIdx, e: n - 1 },
          ]
        : [{ label: phases.ovulation.label, color: phases.ovulation.bar, s: 0, e: n - 1 }];

    let yLines = &quot;&quot;;
    let yLabels = &quot;&quot;;
    let pregnancyDots = &quot;&quot;;
    let todayMarker = &quot;&quot;;
    let xLabels = &quot;&quot;;

    [0, Math.round(maxVal / 2), maxVal].forEach((v) =&gt; {
      const y = padT + chartH - (v / maxVal) * chartH;
      yLines += `&lt;line x1=&quot;${padL}&quot; x2=&quot;${W - padR}&quot; y1=&quot;${y}&quot; y2=&quot;${y}&quot; stroke=&quot;#e8e6e0&quot; stroke-width=&quot;0.5&quot;/&gt;`;
      yLabels += `&lt;text x=&quot;${padL - 3}&quot; y=&quot;${y + 3}&quot; text-anchor=&quot;end&quot; font-size=&quot;8&quot; fill=&quot;#aaa&quot;&gt;${v}%&lt;/text&gt;`;
    });

    const points = probs.map((v, i) =&gt; ({
      x: stageRanges ? (stageRanges[i].x1 + stageRanges[i].x2) / 2 : padL + i * xStep,
      y: padT + chartH - (v / maxVal) * chartH,
    }));
    const linePoints = stageRanges
      ? [
          { x: stageRanges[0].x1, y: points[0].y },
          ...points,
          { x: stageRanges[stageRanges.length - 1].x2, y: points[points.length - 1].y },
        ]
      : points;

    const linePath = smoothPath(linePoints);
    const areaPath = `M${linePoints[0].x.toFixed(1)},${(padT + chartH).toFixed(1)} L${linePath.slice(1)} L${linePoints[linePoints.length - 1].x.toFixed(1)},${(padT + chartH).toFixed(1)} Z`;
    const dischargeColor = &quot;#30B89F&quot;;
    const dischargeMax = 3;
    const yDischarge = (value) =&gt; padT + chartH - (value / dischargeMax) * chartH;
    const dischargeCore = hasDischarge
      ? data.dischargeValues.map((v, i) =&gt; ({
          x: points[i]?.x ?? padL + i * xStep,
          y: yDischarge(v),
        }))
      : [];
    const dischargePoints = hasDischarge
      ? [
          { x: stageRanges ? stageRanges[0].x1 : dischargeCore[0].x, y: dischargeCore[0].y },
          ...dischargeCore,
          { x: stageRanges ? stageRanges[stageRanges.length - 1].x2 : dischargeCore[dischargeCore.length - 1].x, y: dischargeCore[dischargeCore.length - 1].y },
        ]
      : [];
    const dischargePath = hasDischarge ? smoothPath(dischargePoints) : &quot;&quot;;
    const dischargeDots = hasDischarge
      ? dischargeCore.map((point, index) =&gt; `&lt;circle cx=&quot;${point.x.toFixed(1)}&quot; cy=&quot;${point.y.toFixed(1)}&quot; r=&quot;${index === todayIdx ? 4 : 3}&quot; fill=&quot;${dischargeColor}&quot; stroke=&quot;#fff&quot; stroke-width=&quot;1.4&quot;/&gt;`).join(&quot;&quot;)
      : &quot;&quot;;
    const dischargeAxis = hasDischarge
      ? [
          { label: &quot;多&quot;, value: 3 },
          { label: &quot;中&quot;, value: 1.5 },
          { label: &quot;少&quot;, value: 0 },
        ].map((tick) =&gt; {
          const y = yDischarge(tick.value);
          return `&lt;text x=&quot;${W - padR + 6}&quot; y=&quot;${(y + 3).toFixed(1)}&quot; font-size=&quot;8&quot; fill=&quot;#8f8a82&quot;&gt;${tick.label}&lt;/text&gt;`;
        }).join(&quot;&quot;)
      : &quot;&quot;;
    const pregValueLabels = hasDischarge
      ? points.map((point, index) =&gt; `&lt;text x=&quot;${point.x.toFixed(1)}&quot; y=&quot;${(point.y - 7).toFixed(1)}&quot; text-anchor=&quot;middle&quot; font-size=&quot;8&quot; fill=&quot;#c97808&quot; font-weight=&quot;600&quot;&gt;${probs[index]}%&lt;/text&gt;`).join(&quot;&quot;)
      : &quot;&quot;;
    const legendStartX = (W - 112) / 2;
    const legendY = H + 20;
    const chartLegend = hasDischarge
      ? `&lt;g class=&quot;preg-legend-toggle&quot; data-pregnancy-legend style=&quot;cursor:pointer&quot;&gt;&lt;rect x=&quot;${(legendStartX - 6).toFixed(1)}&quot; y=&quot;${legendY - 9}&quot; width=&quot;66&quot; height=&quot;16&quot; rx=&quot;8&quot; fill=&quot;transparent&quot;/&gt;&lt;circle data-pregnancy-legend-dot cx=&quot;${legendStartX.toFixed(1)}&quot; cy=&quot;${legendY}&quot; r=&quot;3&quot; fill=&quot;#F5A623&quot;/&gt;&lt;text data-pregnancy-legend-text x=&quot;${(legendStartX + 9).toFixed(1)}&quot; y=&quot;${legendY + 3}&quot; font-size=&quot;8&quot; fill=&quot;#8f8a82&quot;&gt;怀孕几率&lt;/text&gt;&lt;/g&gt;&lt;circle cx=&quot;${(legendStartX + 74).toFixed(1)}&quot; cy=&quot;${legendY}&quot; r=&quot;3&quot; fill=&quot;${dischargeColor}&quot;/&gt;&lt;text x=&quot;${(legendStartX + 83).toFixed(1)}&quot; y=&quot;${legendY + 3}&quot; font-size=&quot;8&quot; fill=&quot;#8f8a82&quot;&gt;白带量&lt;/text&gt;`

    points.forEach((p, i) =&gt; {
      const isToday = i === todayIdx;

      const col = phase.color;
      pregnancyDots += `&lt;circle class=&quot;${isToday ? &quot;chart-today-mark&quot; : &quot;&quot;}&quot; cx=&quot;${p.x.toFixed(1)}&quot; cy=&quot;${p.y.toFixed(1)}&quot; r=&quot;${isToday ? 5 : 3}&quot; fill=&quot;${isToday ? &quot;#378ADD&quot; : col}&quot; stroke=&quot;#fff&quot; stroke-width=&quot;1.5&quot;/&gt;`;

        const badgeH = data.todayBadgeLines ? 30 : 14;

        const textX = badgeX + badgeW / 2;
        todayMarker += `&lt;line class=&quot;chart-today-line&quot; x1=&quot;${p.x.toFixed(1)}&quot; x2=&quot;${p.x.toFixed(1)}&quot; y1=&quot;${padT}&quot; y2=&quot;${(padT + chartH).toFixed(1)}&quot; stroke=&quot;#378ADD&quot; stroke-width=&quot;1&quot; stroke-dasharray=&quot;3,2&quot;/&gt;`;
        todayMarker += `&lt;rect class=&quot;chart-today-badge&quot; data-today-badge x=&quot;${badgeX.toFixed(1)}&quot; y=&quot;${badgeY.toFixed(1)}&quot; width=&quot;${badgeW}&quot; height=&quot;${badgeH}&quot; data-full-height=&quot;${badgeH}&quot; data-compact-height=&quot;18&quot; rx=&quot;${data.todayBadgeLines ? 7 : 4}&quot; fill=&quot;#378ADD&quot;/&gt;`;
        todayMarker += badgeLines.map((line, lineIndex) =&gt; {

  function renderMenstrualChart(containerId, todayDay, todayProb, dateOffset = 0) {

    const displayPhaseDefs = phaseDefs.map((phase) =&gt; ({

    function getPhase(day) {

    function formatDateForCycleDay(day) {
      const date = new Date(2026, 6, day + dateOffset);
      return `${date.getMonth() + 1}.${date.getDate()}`;

    const mu = 28;
    const sigma = 3;
    const norm = (x) =&gt; Math.exp(-0.5 * ((x - mu) / sigma) ** 2) / (sigma * Math.sqrt(2 * Math.PI));
    const raw = days.map((day) =&gt; {

    if (!match) return [];

    const startMonth = Number(match[1]);
    const startDay = Number(match[2]);
    return week.days.map((_, index) =&gt; {
      const date = new Date(2026, startMonth - 1, startDay + index);
      return date.getDate();

      ${meta ? `&lt;div class=&quot;day-tile__meta&quot;&gt;${meta}&lt;/div&gt;` : &quot;&quot;}`;

    if (day.selectable) {
      return `&lt;button class=&quot;${classes}&quot; type=&quot;button&quot; style=&quot;${dayStyle(day)}&quot; data-day-select=&quot;${options.weekId}&quot; data-day-index=&quot;${options.dayIndex}&quot; aria-pressed=&quot;${day.selected || day.today ? &quot;true&quot; : &quot;false&quot;}&quot; aria-label=&quot;切换到${day.d}&quot;&gt;
        ${content}
      &lt;/button&gt;`;
    }

    return `&lt;div class=&quot;${classes}&quot; style=&quot;${dayStyle(day)}&quot;&gt;
      ${content}
    &lt;/div&gt;`;
  }

  function renderBriefingHeader(week) {
    const dominant = phases[week.dominant];
    if (week.compactHeader) {
      const dateNumbers = getWeekDateNumbers(week);
      const dayStrip = `&lt;div class=&quot;header-day-strip&quot;&gt;${week.days.map((day, index) =&gt; renderDay(day, dateNumbers[index], { weekId: week.id, dayIndex: index })).join(&quot;&quot;)}&lt;/div&gt;`;

      return `&lt;header class=&quot;briefing-top briefing-top--calendar&quot; style=&quot;${phaseStyle(dominant)}&quot;&gt;
        &lt;div class=&quot;briefing-titlebar briefing-titlebar--calendar&quot;&gt;
          &lt;button class=&quot;briefing-back&quot; type=&quot;button&quot; aria-label=&quot;返回&quot;&gt;‹&lt;/button&gt;
          &lt;div class=&quot;briefing-title&quot;&gt;本周密报&lt;/div&gt;
          &lt;span class=&quot;briefing-titlebar__space&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;
        &lt;/div&gt;
        ${dayStrip}
      &lt;/header&gt;`;
    }

    const dateNav = [&quot;b&quot;, &quot;c&quot;, &quot;d&quot;, &quot;e&quot;, &quot;f&quot;, &quot;g&quot;].includes(week.id) ? &quot;&quot; : `&lt;nav class=&quot;date-nav&quot; aria-label=&quot;周导航&quot;&gt;
        &lt;span class=&quot;date-nav__range&quot;&gt;6.30-7.6&lt;/span&gt;
        &lt;button class=&quot;date-nav__item&quot; type=&quot;button&quot;&gt;上周&lt;/button&gt;
        &lt;span class=&quot;date-nav__divider&quot; aria-hidden=&quot;true&quot;&gt;·&lt;/span&gt;
        &lt;button class=&quot;date-nav__item is-current&quot; type=&quot;button&quot; aria-current=&quot;date&quot;&gt;本周&lt;/button&gt;
        &lt;span class=&quot;date-nav__divider&quot; aria-hidden=&quot;true&quot;&gt;·&lt;/span&gt;
        &lt;button class=&quot;date-nav__item&quot; type=&quot;button&quot;&gt;下周&lt;/button&gt;
        &lt;span class=&quot;date-nav__range&quot;&gt;7.28-8.3&lt;/span&gt;
      &lt;/nav&gt;`;

    return `&lt;header class=&quot;briefing-top&quot; style=&quot;${phaseStyle(dominant)}&quot;&gt;
      &lt;div class=&quot;briefing-titlebar&quot;&gt;
        &lt;button class=&quot;briefing-back&quot; type=&quot;button&quot; aria-label=&quot;返回&quot;&gt;‹&lt;/button&gt;
        &lt;div class=&quot;briefing-title&quot;&gt;本周密报&lt;/div&gt;
        &lt;span class=&quot;briefing-titlebar__space&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;
      &lt;/div&gt;
      ${dateNav}
    &lt;/header&gt;`;
  }

function renderForecastContent(week) {
    if (!week.forecastData) return &quot;&quot;;
    return `&lt;div class=&quot;chart-card__head&quot;&gt;
        &lt;span class=&quot;chart-card__title&quot;&gt;经期开始预测&lt;/span&gt;
        &lt;span class=&quot;chart-card__badge is-menstrual&quot;&gt;预测&lt;/span&gt;
      &lt;/div&gt;
      &lt;div id=&quot;forecastChart_${week.id}&quot;&gt;&lt;/div&gt;
      &lt;p class=&quot;forecast-note&quot;&gt;经期开始时间基于历史周期估算，实际日期可能提前或推后；新的月经记录会用于更新后续周期。&lt;/p&gt;`;
  }

  function renderDelayContent(week) {
    if (!week.delayData) return &quot;&quot;;
    return `&lt;div class=&quot;delay-tip&quot;&gt;
        &lt;div class=&quot;delay-tip__title&quot;&gt;
          &lt;span class=&quot;delay-tip__icon&quot;&gt;i&lt;/span&gt;
          &lt;span&gt;推迟期小贴士&lt;/span&gt;
        &lt;/div&gt;
        &lt;p class=&quot;delay-tip__copy&quot;&gt;${week.delayTip || &quot;月经日期来自历史周期预测，每个周期出现几天波动并不少见。&quot;}&lt;/p&gt;
      &lt;/div&gt;`;
  }
  function renderPregnancyChartContent(week) {
    if (!week.showPregChart || !week.pregData) return &quot;&quot;;
    const chartTitle = week.pregData.dischargeValues ? &quot;怀孕几率与白带变化&quot; : &quot;怀孕几率&quot;;

    return `&lt;div class=&quot;chart-card__head&quot;&gt;
        &lt;span class=&quot;chart-card__title&quot;&gt;${chartTitle}&lt;/span&gt;
      &lt;/div&gt;
      &lt;div id=&quot;pregChart_${week.id}&quot;&gt;&lt;/div&gt;`;
  }

  function renderPregnancyChartCard(week) {
    if (!week.showPregChart || !week.pregData || week.mergeIntroWithCharts) return &quot;&quot;;

    return `&lt;article class=&quot;card chart-card&quot;&gt;
      ${renderPregnancyChartContent(week)}
    &lt;/article&gt;`;
  }

  function renderMenstrualChartContent(week) {
    if (!week.showChart) return &quot;&quot;;
    const todayProb = week.menstrualTodayProb ?? 4;

    return `&lt;div class=&quot;chart-card__head&quot;&gt;
        &lt;span class=&quot;chart-card__title&quot;&gt;预测月经概率&lt;/span&gt;
      &lt;/div&gt;
      &lt;div id=&quot;menChart_${week.id}&quot;&gt;&lt;/div&gt;`;
  }

  function renderMenstrualChartCard(week) {
    if (!week.showChart || week.mergeIntroWithCharts) return &quot;&quot;;

    return `&lt;article class=&quot;card chart-card&quot;&gt;
      ${renderMenstrualChartContent(week)}
    &lt;/article&gt;`;
  }

  function renderFlowChartContent(week) {
    if (!week.flowData) return &quot;&quot;;

    return `&lt;div class=&quot;chart-card__head&quot;&gt;
        &lt;span class=&quot;chart-card__title&quot;&gt;经血量分布&lt;/span&gt;
      &lt;/div&gt;
      &lt;div id=&quot;flowChart_${week.id}&quot;&gt;&lt;/div&gt;`;
  }

  function renderFlowChartCard(week) {
    if (!week.flowData || week.mergeIntroWithFlow) return &quot;&quot;;

    return `&lt;article class=&quot;card chart-card&quot;&gt;
      ${renderFlowChartContent(week)}
    &lt;/article&gt;`;
  }

  function renderSection(section, hideHead = false) {
    const phase = phases[section.ph];
    const actions = section.actions.map((action) =&gt; `&lt;div class=&quot;seg&quot;&gt;
      &lt;div class=&quot;seg__dot&quot;&gt;&lt;/div&gt;
      &lt;span class=&quot;seg__copy&quot;&gt;${action}&lt;/span&gt;
    &lt;/div&gt;`).join(&quot;&quot;);

    return `&lt;section class=&quot;advice-section section-card&quot; style=&quot;${phaseStyle(phase)}&quot;&gt;
      ${hideHead ? &quot;&quot; : `&lt;div class=&quot;section-card__head&quot;&gt;
        &lt;span class=&quot;section-card__marker&quot;&gt;&lt;/span&gt;
        &lt;span class=&quot;section-card__range&quot;&gt;${section.range}&lt;/span&gt;
      &lt;/div&gt;`}
      ${actions}
    &lt;/section&gt;`;
  }

  function renderAdviceCard(week) {
    if (!week.sections?.length) return &quot;&quot;;
    const hideSectionHeads = week.sections.length === 1;

    return `&lt;article class=&quot;card advice-card&quot;&gt;
      &lt;h2 class=&quot;advice-card__title&quot;&gt;本周建议&lt;/h2&gt;
      ${week.sections.map((section) =&gt; renderSection(section, hideSectionHeads)).join(&quot;&quot;)}
    &lt;/article&gt;`;
  }

  function renderNextWeek(week) {
    return `&lt;article class=&quot;card next-card&quot;&gt;
      &lt;h2 class=&quot;advice-card__title&quot;&gt;下周预告&lt;/h2&gt;
      &lt;p class=&quot;next-card__copy&quot;&gt;${week.nextWeek}&lt;/p&gt;
    &lt;/article&gt;`;
  }

  function renderWeekOverviewCard(week) {
    if (!week.showOverviewCard) return &quot;&quot;;
    const dominant = phases[week.dominant];

    return `&lt;article class=&quot;card week-overview-card&quot; style=&quot;${phaseStyle(dominant)}&quot;&gt;
      &lt;h2 class=&quot;advice-card__title&quot;&gt;本周概况&lt;/h2&gt;
      &lt;div class=&quot;week-hero__title-row&quot;&gt;
        &lt;div class=&quot;week-hero__title&quot;&gt;${week.title}&lt;/div&gt;
        &lt;span class=&quot;tag&quot;&gt;${week.subtitle}&lt;/span&gt;
      &lt;/div&gt;
      &lt;h1 class=&quot;week-hero__headline&quot;&gt;${week.headline}&lt;/h1&gt;
      &lt;p class=&quot;week-hero__summary&quot;&gt;${week.summary}&lt;/p&gt;
    &lt;/article&gt;`;
  }

  function renderWeekHeroIntro(week) {
    const tag = `&lt;span class=&quot;tag&quot;&gt;${week.subtitle}&lt;/span&gt;`;
    const dateNumbers = getWeekDateNumbers(week);
    const shouldShowDayStrip = !week.hideDayStrip;
    const dayStripClass = `day-strip${week.dayStripPosition === &quot;top&quot; ? &quot; day-strip--top&quot; : &quot;&quot;}`;
    const dayStrip = shouldShowDayStrip ? `&lt;div class=&quot;${dayStripClass}&quot;&gt;${week.days.map((day, index) =&gt; renderDay(day, dateNumbers[index], { weekId: week.id, dayIndex: index })).join(&quot;&quot;)}&lt;/div&gt;` : &quot;&quot;;
    const titleBlock = `&lt;div class=&quot;week-hero__content&quot;&gt;
      &lt;div class=&quot;week-hero__title-row&quot;&gt;
        &lt;div class=&quot;week-hero__title&quot;&gt;${week.title}&lt;/div&gt;
        ${tag}
      &lt;/div&gt;
      ${week.dayStripPosition === &quot;top&quot; || !shouldShowDayStrip ? &quot;&quot; : dayStrip}
      &lt;h1 class=&quot;week-hero__headline&quot;&gt;${week.headline}&lt;/h1&gt;
    &lt;/div&gt;`;

    if (!week.topTitle) {
      return titleBlock;
    }

    const leadClass = `week-hero__lead${week.leadAnimation ? ` is-${week.leadAnimation}` : &quot;&quot;}`;

    return `${week.dayStripPosition === &quot;top&quot; &amp;&amp; shouldShowDayStrip ? dayStrip : &quot;&quot;}
    &lt;div class=&quot;${leadClass}&quot;&gt;
      &lt;div class=&quot;today-title-card__text&quot;&gt;${week.topTitle}&lt;/div&gt;
      ${week.periodCountdown ? `&lt;div class=&quot;period-countdown&quot;&gt;距月经开始（${week.periodCountdown.date}）还有${week.periodCountdown.days}天&lt;/div&gt;` : &quot;&quot;}
      ${week.topDescription ? `&lt;p class=&quot;today-title-card__desc&quot;&gt;${week.topDescription}&lt;/p&gt;` : &quot;&quot;}
    &lt;/div&gt;
    ${week.showOverviewCard ? &quot;&quot; : `&lt;div class=&quot;week-hero__top week-hero__top--stack&quot;&gt;
      ${titleBlock}
    &lt;/div&gt;`}`;
  }

  function renderHeroCard(week, dominant) {
    const chartBlocks = [];
    if (week.mergeIntroWithFlow) chartBlocks.push(renderFlowChartContent(week));
    if (week.mergeIntroWithForecast) chartBlocks.push(renderForecastContent(week));
    if (week.mergeIntroWithDelay) chartBlocks.push(renderDelayContent(week));
    if (week.mergeIntroWithCharts) {
      chartBlocks.push(renderMenstrualChartContent(week));
      chartBlocks.push(renderPregnancyChartContent(week));
    }
    const chartClass = `week-hero__chart${week.leadAnimation ? ` is-${week.leadAnimation}` : &quot;&quot;}`;
    const charts = chartBlocks.filter(Boolean).map((chart) =&gt; `&lt;div class=&quot;${chartClass}&quot;&gt;${chart}&lt;/div&gt;`).join(&quot;&quot;);
    const hasMergedChart = Boolean(charts);

    return `&lt;article class=&quot;card week-hero${hasMergedChart ? &quot; week-hero--with-chart&quot; : &quot;&quot;}&quot; style=&quot;${phaseStyle(dominant)}&quot;&gt;
      ${renderWeekHeroIntro(week)}
      ${week.showOverviewCard ? &quot;&quot; : `&lt;p class=&quot;week-hero__summary&quot;&gt;${week.summary}&lt;/p&gt;`}
      ${charts}
    &lt;/article&gt;`;
  }

  function renderWeek(week) {
    const dominant = phases[week.dominant];
    const heroDominant = phases[week.heroPhase || week.dominant];
    const menstrualChart = renderMenstrualChartCard(week);
    const pregnancyChart = renderPregnancyChartCard(week);
    const showMenstrualChartBeforeSections = week.id === &quot;d&quot;;
    const showPregnancyChartAfterMenstrual = week.id === &quot;d&quot;;

    return `${renderBriefingHeader(week)}
    ${renderHeroCard(week, heroDominant)}
    ${showPregnancyChartAfterMenstrual ? &quot;&quot; : pregnancyChart}
    ${renderFlowChartCard(week)}
    ${showMenstrualChartBeforeSections ? menstrualChart : &quot;&quot;}
    ${showPregnancyChartAfterMenstrual ? pregnancyChart : &quot;&quot;}
    ${renderWeekOverviewCard(week)}
    ${renderAdviceCard(week)}
    ${showMenstrualChartBeforeSections ? &quot;&quot; : menstrualChart}
    ${renderNextWeek(week)}`;
  }

  function syncTabs() {
    document.querySelectorAll(&quot;.tab&quot;).forEach((tab) =&gt; {
      const week = weeks.find((item) =&gt; item.id === tab.dataset.id);
      const phase = phases[week.dominant];
      const active = tab.dataset.id === currentId;

      tab.style.background = active ? phase.bar : &quot;transparent&quot;;
      tab.style.color = active ? phase.dark : &quot;#5F5E5A&quot;;
      tab.style.borderColor = active ? phase.bar : &quot;rgba(0,0,0,0.12)&quot;;
      tab.setAttribute(&quot;aria-selected&quot;, String(active));
    });
  }

  function switchTab(id) {
    const week = weeks.find((item) =&gt; item.id === id);
    if (!week) return;

    currentId = id;
    selectedDayAnimationByWeek[id] = &quot;&quot;;
    suppressTodayAnimationByWeek[id] = false;
    syncTabs();
    mountWeek(week);
  }

  function mountWeek(week) {
    const displayWeek = getDisplayWeek(week);
    const id = displayWeek.id;

    panelEl.innerHTML = renderWeek(displayWeek);
    bindDaySelectors(week);

    requestAnimationFrame(() =&gt; {
      if (displayWeek.flowData) renderFlowChart(displayWeek.flowData, `flowChart_${id}`);
      if (displayWeek.forecastData) renderForecastChart(displayWeek.forecastData, `forecastChart_${id}`);
      if (displayWeek.showPregChart &amp;&amp; displayWeek.pregData) renderPregChart(displayWeek.pregData, `pregChart_${id}`);
      if (displayWeek.showChart) renderMenstrualChart(`menChart_${id}`, displayWeek.menstrualTodayDay ?? 23, displayWeek.menstrualTodayProb, displayWeek.menstrualDateOffset ?? 0);
    });
  }

  function bindDaySelectors(week) {
    panelEl.querySelectorAll(&quot;[data-day-select]&quot;).forEach((button) =&gt; {
      button.addEventListener(&quot;click&quot;, () =&gt; {
        const nextIndex = Number(button.dataset.dayIndex);
        const currentIndex = getSelectedDayIndex(week);
        selectedDayAnimationByWeek[week.id] = nextIndex &gt; currentIndex
          ? &quot;slide-left&quot;
          : nextIndex &lt; currentIndex
            ? &quot;slide-right&quot;
            : &quot;&quot;;
        selectedDayByWeek[week.id] = nextIndex;
        suppressTodayAnimationByWeek[week.id] = true;
        mountWeek(week);
      });
    });
  }

  function initTabs() {
    weeks.forEach((week) =&gt; {
      const button = document.createElement(&quot;button&quot;);
      button.className = &quot;tab&quot;;
      button.type = &quot;button&quot;;
      button.dataset.id = week.id;
      button.textContent = week.tabLabel;
      button.setAttribute(&quot;role&quot;, &quot;tab&quot;);
      button.addEventListener(&quot;click&quot;, () =&gt; switchTab(week.id));
      tabsEl.appendChild(button);
    });
  }

  initTabs();
  switchTab(currentId);
})();
&lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;"></iframe>
</body>
</html>
